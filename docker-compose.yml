services:
  snipe-terminal-bridge:
    build: .
    image: snipe-terminal-bridge:1.0.0-rc14
    container_name: snipe-terminal-bridge
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - snipe_terminal_bridge_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  snipe_terminal_bridge_data:
