name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the operator, administrator, or terminal problem rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Legacy-terminal impact
      description: Explain any browser, screen-size, scanner-key, memory, or network implications.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
